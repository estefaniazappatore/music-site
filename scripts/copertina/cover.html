<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:640px;height:640px;overflow:hidden;background:#111013}
.c{position:relative;width:640px;height:640px;overflow:hidden;font-family:'DM Sans',sans-serif;color:#e6e5d7}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.top{position:absolute;left:48px;top:46px;right:48px;display:flex;justify-content:space-between;align-items:center;font-family:Inter;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:rgba(230,229,215,.6)}
.top i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff8a3d;margin-right:10px;vertical-align:1px}
.title{position:absolute;left:46px;top:104px;font-weight:500;font-size:92px;line-height:.93;letter-spacing:-.05em}
.title span{color:rgba(230,229,215,.5)}
.num{position:absolute;left:40px;bottom:22px;font-weight:500;font-size:250px;line-height:.8;letter-spacing:-.07em}
.num small{font-size:120px;vertical-align:top;letter-spacing:-.04em;color:rgba(230,229,215,.55);margin-right:6px;position:relative;top:22px}

/* A: due bagliori, arancio e blu */
.A{background:
  radial-gradient(60% 55% at 92% 88%,rgba(255,138,61,.95),transparent 70%),
  radial-gradient(55% 50% at 8% 6%,rgba(75,111,165,.85),transparent 70%),
  radial-gradient(70% 60% at 70% 30%,rgba(217,130,59,.25),transparent 70%),#111013}

/* B: cerchi concentrici, vista dall'alto della tazza */
.B{background:#111013}
.B .cup{position:absolute;right:-170px;bottom:-170px;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,#3a2414 0 22%,#7a4a24 23% 30%,#c9864a 31% 34%,transparent 35%),
  repeating-radial-gradient(circle,rgba(230,229,215,.10) 0 2px,transparent 2px 26px),
  conic-gradient(from 200deg,#ff8a3d,#4b6fa5,#2f6f9f,#ff8a3d)}
.B .cup:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 34%,rgba(17,16,19,.55) 36%,rgba(17,16,19,.15) 70%,transparent 71%)}
.B .num{left:auto;right:auto;top:auto}

/* C: tinta che cambia con il numero */
.C{background:linear-gradient(160deg,var(--h1) 0%,var(--h2) 55%,#111013 100%)}
.C .title{color:#fffaf2}.C .title span{color:rgba(255,250,242,.6)}
.C .num{color:#fffaf2}.C .num small{color:rgba(255,250,242,.6)}
.C .ring{position:absolute;right:-120px;top:-120px;width:420px;height:420px;border-radius:50%;border:2px solid rgba(255,250,242,.25)}
.C .ring.r2{right:-60px;top:-60px;width:300px;height:300px}

/* D: pastello iridescente su nero */
.D{background:
  radial-gradient(48% 42% at var(--x1) var(--y1),rgba(240,139,200,.95),transparent 70%),
  radial-gradient(45% 40% at var(--x2) var(--y2),rgba(134,169,224,.95),transparent 70%),
  radial-gradient(40% 36% at var(--x3) var(--y3),rgba(251,233,184,.85),transparent 70%),
  radial-gradient(30% 28% at var(--x4) var(--y4),rgba(216,245,238,.75),transparent 70%),
  radial-gradient(55% 50% at 60% 60%,rgba(197,143,214,.45),transparent 75%),#111013}
/* E: pastello iridescente su chiaro */
.E{background:
  radial-gradient(48% 42% at var(--x1) var(--y1),rgba(240,139,200,.85),transparent 70%),
  radial-gradient(45% 40% at var(--x2) var(--y2),rgba(134,169,224,.85),transparent 70%),
  radial-gradient(40% 36% at var(--x3) var(--y3),rgba(251,233,184,.95),transparent 70%),
  radial-gradient(30% 28% at var(--x4) var(--y4),rgba(216,245,238,.95),transparent 70%),
  radial-gradient(55% 50% at 60% 60%,rgba(197,143,214,.40),transparent 75%),#fbf8f3;color:#17161a}
.E .top{color:rgba(23,22,26,.55)}.E .title span{color:rgba(23,22,26,.45)}.E .num small{color:rgba(23,22,26,.4)}
.E .grain{opacity:.12}
.D .grain,.E .grain{filter:blur(.2px)}
.blur{position:absolute;inset:0;backdrop-filter:blur(30px)}

.D .blob,.E .blob{position:absolute;width:560px;height:620px;right:-90px;bottom:-150px;border-radius:48% 52% 45% 55%/55% 45% 55% 45%;
  background:conic-gradient(from var(--rot),#f08bc8,#c58fd6,#86a9e0,#d8f5ee,#fbe9b8,#f5b6c8,#f08bc8);filter:blur(38px);transform:rotate(var(--rot))}
.D .blob2,.E .blob2{position:absolute;width:300px;height:300px;left:-60px;top:-80px;border-radius:50%;
  background:radial-gradient(circle,#fbe9b8,rgba(251,233,184,0) 70%);filter:blur(10px)}
.D{background:#111013}.E{background:#fbf8f3}
.D .top i,.E .top i{background:#f08bc8}
.E .blob{opacity:.95}.D .blob{opacity:.9}.D .blob2{opacity:.35}
</style></head>
<body>
<div class="c" id="c">
  <div class="top"><span><i></i>Playlist</span><span>Estefania</span></div>
  <div class="title">Caffè<br><span>in cuffia</span></div>
  <div class="num"><small>#</small><b id="n">302</b></div>
  <div class="grain"></div>
</div>
<script>
const q=new URLSearchParams(location.search);const v="E",n=+(q.get("n")||302);
const c=document.getElementById("c");c.classList.add(v);document.getElementById("n").textContent=n;
if(v==="D"||v==="E"){
  const r=k=>((Math.sin(n*12.9898+k*78.233)*43758.5453)%1+1)%1;
  const pos=[[78,82],[18,92],[88,22],[30,58]];
  c.insertAdjacentHTML("afterbegin",'<div class="blob2"></div><div class="blob"></div>');c.style.setProperty("--rot",Math.floor(r(3)*360)+"deg");
  pos.forEach((p,i)=>{c.style.setProperty("--x"+(i+1),(p[0]+(r(i)-.5)*30)+"%");c.style.setProperty("--y"+(i+1),(p[1]+(r(i+9)-.5)*30)+"%");});
}
if(v==="B"){c.insertAdjacentHTML("afterbegin",'<div class="cup"></div>')}
if(v==="C"){
  const P=[["#ff8a3d","#8a3f14"],["#4b6fa5","#1a2a48"],["#d9a066","#5a3a1c"],["#2f6f9f","#10283c"],["#e8742c","#3a1f10"],["#6b84c4","#202a4a"]];
  const p=P[n%P.length];c.style.setProperty("--h1",p[0]);c.style.setProperty("--h2",p[1]);
  c.insertAdjacentHTML("afterbegin",'<div class="ring"></div><div class="ring r2"></div>');
}
</script>
</body></html>
