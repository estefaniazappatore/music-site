name: Newsletter Caffè in cuffia

on:
  schedule:
    - cron: "0 17 * * 0"
  workflow_dispatch:
    inputs:
      prova:
        description: "Solo anteprima (non programma il lunedì)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  newsletter:
    runs-on: ubuntu-latest
    env:
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepara anteprima e invio del lunedì
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prova }}" = "true" ]; then
            python scripts/newsletter.py --prova
          else
            python scripts/newsletter.py
          fi
      - name: Salva a che punto siamo
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add scripts/newsletter_stato.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Newsletter inviata $(date -u +%F)" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done; git diff --quiet origin/main HEAD)
