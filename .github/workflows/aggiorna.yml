name: Aggiorna dati Spotify

on:
  schedule:
  - cron: "17 * * * *"   # ogni ora, ma lo script lavora davvero solo ogni 6 ore o a blocco di Spotify finito
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install spotipy
      - name: Leggi Spotify e rigenera data.json
        id: dati
        run: python scripts/aggiorna_dati.py
      - name: Genera le copertine mancanti
        if: steps.dati.outputs.salta != 'true'
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/genera_copertine.js
      - name: Carica le copertine su Spotify
        if: steps.dati.outputs.salta != 'true'
        run: python scripts/carica_copertine.py
      - name: Salva le novità
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add site/ scripts/cache.json; git add scripts/stato_spotify.json scripts/copertine_caricate.json 2>/dev/null; git add scripts/stato_spotify.json 2>/dev/null; true
          git diff --cached --quiet || (git commit -m "Aggiornamento dati $(date -u +%F)" && for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done; git diff --quiet origin/main HEAD)
