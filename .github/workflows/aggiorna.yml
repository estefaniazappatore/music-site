name: Aggiorna dati Spotify

on:
  schedule:
  - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install spotipy
      - name: Leggi Spotify e rigenera data.json
        run: python scripts/aggiorna_dati.py
      - name: Genera le copertine mancanti
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node scripts/genera_copertine.js
      - name: Carica le copertine su Spotify
        run: python scripts/carica_copertine.py
      - name: Salva le novità
        run: |
          git config user.name "music-bot"
          git config user.email "music-bot@users.noreply.github.com"
          git add site/ scripts/cache.json scripts/copertine_caricate.json 2>/dev/null || git add site/ scripts/cache.json
          git diff --cached --quiet || (git commit -m "Aggiornamento dati $(date -u +%F)" && git push)
